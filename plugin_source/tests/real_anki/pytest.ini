[pytest]
# Real-Anki suite. Deliberately has its own rootdir/ini so that the addon's
# root conftest.py (which fakes the whole `anki` package) is NOT loaded.
#
# Normally you do not run this directly: `pytest tests` executes every file in
# this directory through tests/test_real_anki.py, which starts a clean
# interpreter. This ini is used by that runner (and for focused debugging):
#   python -m pytest tests/real_anki -c tests/real_anki/pytest.ini
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = __pycache__ .pytest_cache
addopts = -v --tb=short --import-mode=importlib
