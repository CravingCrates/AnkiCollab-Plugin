[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .venv __pycache__ crowd_anki ui dist MagicMock notifications_webview real_anki
asyncio_mode = auto
markers =
    integration: workflow-level tests (tests/integration/) that exercise the real
        export/import/media orchestration against a realistic in-memory collection
    real_anki: tests that run inside the isolated real-Anki subprocess
addopts = -v --tb=short --import-mode=importlib
